plugins {
    id 'com.android.application'
}

def adminUrl = providers.gradleProperty('adminUrl').orElse('https://admin.prime.example').get()

android {
    namespace 'com.prime.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.prime.admin'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'ADMIN_URL', '"' + adminUrl.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }
}

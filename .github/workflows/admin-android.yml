name: Admin Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - name: Assemble release APK
        run: gradle :app:assembleRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-admin-android
          path: apps/admin/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

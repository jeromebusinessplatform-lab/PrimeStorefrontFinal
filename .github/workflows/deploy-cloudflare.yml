name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify Cloudflare credentials
        run: pnpm dlx wrangler@latest whoami

      - name: Resolve production D1 and prepare deployment config
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@latest d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/d1-list.json', 'utf8');
          const databases = JSON.parse(raw);
          const candidates = databases.filter((db) => {
            const name = String(db.name ?? '').toLowerCase();
            return /prime/.test(name) && /(prod|production)/.test(name);
          });
          const selected = candidates.length === 1 ? candidates[0] : null;
          if (!selected) {
            const summary = databases.map((db) => `${db.name} (${db.uuid ?? db.database_id ?? 'no-id'})`).join('\n');
            if (candidates.length > 1) throw new Error(`Multiple Prime production D1 databases found; refusing to guess:\n${candidates.map((db) => db.name).join('\n')}`);
            throw new Error(`No uniquely identifiable Prime production D1 database found. Available D1 databases:\n${summary || '(none)'}`);
          }
          const id = selected.uuid ?? selected.database_id;
          if (!id) throw new Error(`Selected D1 database ${selected.name} has no database ID.`);
          const base = fs.readFileSync('wrangler.toml', 'utf8');
          const block = `\n\n[[env.production.d1_databases]]\nbinding = "DB"\ndatabase_name = "${selected.name.replaceAll('"', '\\"')}"\ndatabase_id = "${id}"\n`;
          fs.writeFileSync('wrangler.deploy.toml', base + block);
          fs.writeFileSync('/tmp/selected-d1-name', selected.name);
          console.log(`Selected production D1: ${selected.name}`);
          NODE

      - name: Apply production D1 migrations
        run: pnpm dlx wrangler@latest d1 migrations apply "$(cat /tmp/selected-d1-name)" --remote

      - name: Deploy production Worker
        run: pnpm dlx wrangler@latest deploy --config wrangler.deploy.toml --env production

      - name: Print deployment endpoint
        run: |
          echo "Cloudflare production deployment completed."
          echo "Worker: prime-core-service-production"
          echo "workers.dev is enabled by wrangler.toml."

name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify Cloudflare credentials
        run: pnpm dlx wrangler@latest whoami

      # Production D1 is always migrated from the canonical ordered migration
      # history. No ad-hoc schema repair runs before this step.
      - name: Apply production D1 migrations
        run: pnpm dlx wrangler@latest d1 migrations apply prime-commerce-production --remote --config wrangler.toml --env production

      - name: Deploy production Worker
        run: pnpm dlx wrangler@latest deploy --config wrangler.toml --env production

      # /health does not require D1 by design. This endpoint verifies that the
      # DB binding is actually present by reaching a DB-backed customer route.
      # 401 is expected without a customer session; 503 means DB binding is absent.
      - name: Verify production D1 binding
        run: |
          set -euo pipefail
          URL="https://primestorefrontfinal.codespacelabs.workers.dev/customer/catalog/products"
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --max-time 15 -o /tmp/prime-response.json -w '%{http_code}' "$URL")"
            echo "D1 binding smoke-test HTTP status: $STATUS"
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ]; then
              cat /tmp/prime-response.json
              echo
              exit 0
            fi
            cat /tmp/prime-response.json || true
            echo
            echo "D1 binding/schema smoke test failed; waiting 5s..."
            sleep 5
          done
          echo "Production D1 binding smoke test failed."
          exit 1

      - name: Verify deployed Worker health
        run: |
          set -euo pipefail
          URL="https://primestorefrontfinal.codespacelabs.workers.dev/health"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$URL"; then
              echo
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting 5s..."
            sleep 5
          done
          echo "Production Worker health check failed: $URL"
          exit 1

      - name: Print deployment endpoint
        run: |
          echo "Cloudflare production deployment completed."
          echo "Worker: prime-core-service-production"
          echo "Health: https://primestorefrontfinal.codespacelabs.workers.dev/health"
          echo "workers.dev is enabled by wrangler.toml."

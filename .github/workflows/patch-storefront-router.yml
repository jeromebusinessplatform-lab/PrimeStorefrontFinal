name: Patch storefront router

on:
  push:
    branches:
      - feat/next-storefront-checkout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'jeromebusinessplatform-lab' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/next-storefront-checkout
          fetch-depth: 0
      - name: Patch router once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/core-service/src/index.ts')
          s = p.read_text()
          imp = 'import { handleCustomerCatalog, handleCustomerCouriers } from "./modules/storefront/storefront-routes";\n'
          if 'handleCustomerCatalog' not in s:
              marker = 'import { getLoyaltyConfiguration, updateLoyaltyConfiguration, type LoyaltyConfiguration } from "./modules/loyalty/loyalty-config-store";\n'
              if marker not in s:
                  raise SystemExit('loyalty import marker not found')
              s = s.replace(marker, marker + imp, 1)
          route = '    if (url.pathname === "/customer/catalog/products" && request.method === "GET") return handleCustomerCatalog(request, env.DB);\n    if (url.pathname === "/customer/delivery/couriers" && request.method === "GET") return handleCustomerCouriers(request, env.DB);\n'
          marker = '    if (url.pathname === "/customer/checkout/delivery-quote" && request.method === "POST") return handleCustomerCheckout(request, env);\n'
          if '/customer/catalog/products' not in s:
              if marker not in s:
                  raise SystemExit('checkout route marker not found')
              s = s.replace(marker, route + marker, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/core-service/src/index.ts
          if git diff --cached --quiet; then
            echo 'router already patched'
          else
            git commit -m 'feat(shopfront): expose customer catalog and courier routes'
            git push origin feat/next-storefront-checkout
          fi
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feat/next-storefront-checkout
          git rm .github/workflows/patch-storefront-router.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time storefront router patch workflow'
          git push origin feat/next-storefront-checkout

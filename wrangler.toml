name = "prime-core-service"
main = "apps/core-service/src/worker.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
APP_ENV = "local"

# R2 is intentionally optional for the temporary Telegram receipt-storage launch mode.
# Re-add the OBJECTS R2 binding once the account bucket is provisioned.

[env.staging]
name = "prime-core-service-staging"

[env.production]
# Production Worker name intentionally matches the public workers.dev endpoint:
# https://primestorefrontfinal.codespacelabs.workers.dev/
name = "primestorefrontfinal"

[[env.production.d1_databases]]
binding = "DB"
database_name = "prime-commerce-production"
database_id = "c2b102ec-a3cd-4de3-89ff-5d97003d2aad"

[env.production.vars]
APP_ENV = "production"
